# Serviços Systemd para Sistema Imobiliário
# Copiar para /etc/systemd/system/

# ============================================
# Arquivo: /etc/systemd/system/gunicorn-imobiliario.service
# ============================================

[Unit]
Description=Gunicorn daemon for Sistema Imobiliario
Requires=gunicorn-imobiliario.socket
After=network.target postgresql.service
Wants=postgresql.service

[Service]
Type=notify
User=imobiliario
Group=imobiliario
RuntimeDirectory=gunicorn
WorkingDirectory=/home/imobiliario/sistema-imobiliario
Environment="PATH=/home/imobiliario/sistema-imobiliario/venv/bin"
Environment="DJANGO_SETTINGS_MODULE=core.settings_production"
Environment="PYTHONPATH=/home/imobiliario/sistema-imobiliario"
ExecStart=/home/imobiliario/sistema-imobiliario/venv/bin/gunicorn \
    --config /home/imobiliario/sistema-imobiliario/gunicorn_config.py \
    --bind unix:/run/gunicorn/gunicorn.sock \
    --bind 127.0.0.1:8000 \
    core.wsgi:application
ExecReload=/bin/kill -s HUP $MAINPID
KillMode=mixed
TimeoutStopSec=5
PrivateTmp=true
Restart=on-failure
RestartSec=5
StartLimitInterval=60
StartLimitBurst=3

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/home/imobiliario/sistema-imobiliario
ReadWritePaths=/var/log/gunicorn
ReadWritePaths=/run/gunicorn
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Limites de recursos
LimitNOFILE=65536
LimitNPROC=4096
LimitMEMLOCK=64M

[Install]
WantedBy=multi-user.target

# ============================================
# Arquivo: /etc/systemd/system/gunicorn-imobiliario.socket
# ============================================

[Unit]
Description=Gunicorn socket for Sistema Imobiliario

[Socket]
ListenStream=/run/gunicorn/gunicorn.sock
User=www-data
Group=www-data
SocketMode=0660

[Install]
WantedBy=sockets.target

# ============================================
# Arquivo: /etc/systemd/system/notificacoes-imobiliario.service
# ============================================

[Unit]
Description=Servico de Notificacoes - Sistema Imobiliario
After=network.target postgresql.service gunicorn-imobiliario.service
Wants=postgresql.service
Requires=gunicorn-imobiliario.service

[Service]
Type=simple
User=imobiliario
Group=imobiliario
WorkingDirectory=/home/imobiliario/sistema-imobiliario
Environment="PATH=/home/imobiliario/sistema-imobiliario/venv/bin"
Environment="DJANGO_SETTINGS_MODULE=core.settings_production"
Environment="PYTHONPATH=/home/imobiliario/sistema-imobiliario"
ExecStart=/home/imobiliario/sistema-imobiliario/venv/bin/python manage.py servico_notificacoes
Restart=on-failure
RestartSec=10
StartLimitInterval=60
StartLimitBurst=3
TimeoutStartSec=60
TimeoutStopSec=30

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/home/imobiliario/sistema-imobiliario
ReadWritePaths=/var/log
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Limites de recursos
LimitNOFILE=4096
LimitNPROC=1024

# Logs
StandardOutput=journal
StandardError=journal
SyslogIdentifier=notificacoes-imobiliario

[Install]
WantedBy=multi-user.target

# ============================================
# Arquivo: /etc/systemd/system/celery-imobiliario.service
# ============================================

[Unit]
Description=Celery Service for Sistema Imobiliario
After=network.target redis.service postgresql.service
Wants=redis.service postgresql.service

[Service]
Type=forking
User=imobiliario
Group=imobiliario
WorkingDirectory=/home/imobiliario/sistema-imobiliario
Environment="PATH=/home/imobiliario/sistema-imobiliario/venv/bin"
Environment="DJANGO_SETTINGS_MODULE=core.settings_production"
Environment="PYTHONPATH=/home/imobiliario/sistema-imobiliario"
ExecStart=/home/imobiliario/sistema-imobiliario/venv/bin/celery multi start worker1 \
    -A core \
    --pidfile=/var/run/celery/%%n.pid \
    --logfile=/var/log/celery/%%n%%I.log \
    --loglevel=INFO \
    --concurrency=4
ExecStop=/home/imobiliario/sistema-imobiliario/venv/bin/celery multi stopwait worker1 \
    --pidfile=/var/run/celery/%%n.pid
ExecReload=/home/imobiliario/sistema-imobiliario/venv/bin/celery multi restart worker1 \
    -A core \
    --pidfile=/var/run/celery/%%n.pid \
    --logfile=/var/log/celery/%%n%%I.log \
    --loglevel=INFO \
    --concurrency=4
Restart=on-failure
RestartSec=10
RuntimeDirectory=celery
RuntimeDirectoryMode=0755

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/home/imobiliario/sistema-imobiliario
ReadWritePaths=/var/log/celery
ReadWritePaths=/var/run/celery
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Limites de recursos
LimitNOFILE=8192
LimitNPROC=2048

[Install]
WantedBy=multi-user.target

# ============================================
# Arquivo: /etc/systemd/system/celerybeat-imobiliario.service
# ============================================

[Unit]
Description=Celery Beat Service for Sistema Imobiliario
After=network.target redis.service postgresql.service
Wants=redis.service postgresql.service
Requires=celery-imobiliario.service

[Service]
Type=simple
User=imobiliario
Group=imobiliario
WorkingDirectory=/home/imobiliario/sistema-imobiliario
Environment="PATH=/home/imobiliario/sistema-imobiliario/venv/bin"
Environment="DJANGO_SETTINGS_MODULE=core.settings_production"
Environment="PYTHONPATH=/home/imobiliario/sistema-imobiliario"
ExecStart=/home/imobiliario/sistema-imobiliario/venv/bin/celery beat \
    -A core \
    --pidfile=/var/run/celery/beat.pid \
    --logfile=/var/log/celery/beat.log \
    --loglevel=INFO \
    --schedule=/var/run/celery/celerybeat-schedule
Restart=on-failure
RestartSec=10
RuntimeDirectory=celery
RuntimeDirectoryMode=0755

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/home/imobiliario/sistema-imobiliario
ReadWritePaths=/var/log/celery
ReadWritePaths=/var/run/celery
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Limites de recursos
LimitNOFILE=4096
LimitNPROC=1024

[Install]
WantedBy=multi-user.target

# ============================================
# Arquivo: /etc/systemd/system/evolution-api.service
# ============================================

[Unit]
Description=Evolution API for WhatsApp Integration
After=network.target
Wants=network.target

[Service]
Type=simple
User=evolution
Group=evolution
WorkingDirectory=/opt/evolution-api
Environment="NODE_ENV=production"
Environment="PORT=8080"
Environment="DATABASE_ENABLED=true"
Environment="DATABASE_CONNECTION_URI=postgresql://evolution_user:evolution_pass@localhost:5432/evolution_db"
Environment="REDIS_ENABLED=true"
Environment="REDIS_URI=redis://localhost:6379"
Environment="WEBHOOK_GLOBAL_URL=https://DOMAIN_PLACEHOLDER/webhook/whatsapp"
Environment="WEBHOOK_GLOBAL_ENABLED=true"
Environment="CONFIG_SESSION_PHONE_CLIENT=Sistema Imobiliario"
Environment="CONFIG_SESSION_PHONE_NAME=Sistema"
ExecStart=/usr/bin/node dist/src/main.js
Restart=on-failure
RestartSec=10
StartLimitInterval=60
StartLimitBurst=3
TimeoutStartSec=60
TimeoutStopSec=30

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/opt/evolution-api
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Limites de recursos
LimitNOFILE=8192
LimitNPROC=2048

# Logs
StandardOutput=journal
StandardError=journal
SyslogIdentifier=evolution-api

[Install]
WantedBy=multi-user.target

# ============================================
# Arquivo: /etc/systemd/system/backup-imobiliario.service
# ============================================

[Unit]
Description=Backup Service for Sistema Imobiliario
After=network.target postgresql.service
Wants=postgresql.service

[Service]
Type=oneshot
User=imobiliario
Group=imobiliario
WorkingDirectory=/home/imobiliario/sistema-imobiliario
Environment="PATH=/home/imobiliario/sistema-imobiliario/venv/bin"
Environment="DJANGO_SETTINGS_MODULE=core.settings_production"
Environment="PYTHONPATH=/home/imobiliario/sistema-imobiliario"
ExecStart=/home/imobiliario/sistema-imobiliario/scripts/backup.sh
TimeoutStartSec=3600

# Configurações de segurança
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/home/imobiliario/sistema-imobiliario
ReadWritePaths=/var/backups
ReadWritePaths=/tmp
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM

# Logs
StandardOutput=journal
StandardError=journal
SyslogIdentifier=backup-imobiliario

# ============================================
# Arquivo: /etc/systemd/system/backup-imobiliario.timer
# ============================================

[Unit]
Description=Daily Backup Timer for Sistema Imobiliario
Requires=backup-imobiliario.service

[Timer]
OnCalendar=daily
RandomizedDelaySec=1800
Persistent=true

[Install]
WantedBy=timers.target

# ============================================
# COMANDOS PARA INSTALAÇÃO E ATIVAÇÃO
# ============================================

# 1. Copiar arquivos de serviço:
# sudo cp systemd_services.conf /tmp/
# sudo systemctl daemon-reload

# 2. Criar diretórios necessários:
# sudo mkdir -p /var/log/gunicorn /var/log/celery /var/run/celery /var/backups
# sudo chown imobiliario:imobiliario /var/log/gunicorn /var/log/celery /var/run/celery /var/backups
# sudo chmod 755 /var/log/gunicorn /var/log/celery /var/run/celery /var/backups

# 3. Ativar e iniciar serviços:
# sudo systemctl enable gunicorn-imobiliario.socket
# sudo systemctl enable gunicorn-imobiliario.service
# sudo systemctl enable notificacoes-imobiliario.service
# sudo systemctl enable celery-imobiliario.service
# sudo systemctl enable celerybeat-imobiliario.service
# sudo systemctl enable evolution-api.service
# sudo systemctl enable backup-imobiliario.timer

# 4. Iniciar serviços:
# sudo systemctl start gunicorn-imobiliario.socket
# sudo systemctl start gunicorn-imobiliario.service
# sudo systemctl start notificacoes-imobiliario.service
# sudo systemctl start celery-imobiliario.service
# sudo systemctl start celerybeat-imobiliario.service
# sudo systemctl start evolution-api.service
# sudo systemctl start backup-imobiliario.timer

# 5. Verificar status:
# sudo systemctl status gunicorn-imobiliario
# sudo systemctl status notificacoes-imobiliario
# sudo systemctl status celery-imobiliario
# sudo systemctl status celerybeat-imobiliario
# sudo systemctl status evolution-api
# sudo systemctl list-timers backup-imobiliario

# 6. Ver logs:
# sudo journalctl -u gunicorn-imobiliario -f
# sudo journalctl -u notificacoes-imobiliario -f
# sudo journalctl -u celery-imobiliario -f
# sudo journalctl -u evolution-api -f

# 7. Recarregar configurações:
# sudo systemctl daemon-reload
# sudo systemctl restart gunicorn-imobiliario
# sudo systemctl restart notificacoes-imobiliario