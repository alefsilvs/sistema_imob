databases:
  - name: sistema-imo-db
    databaseName: sistema_imo
    user: sistema_imo_user
    plan: free

services:
  - type: web
    name: sistema-imobiliario
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn sistema_imobiliario.wsgi:application"
    healthCheckPath: "/"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-imo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: sistema_imobiliario.settings_render
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true
    disk:
      name: sistema-imo-disk
      mountPath: /opt/render/project/src/media
      sizeGB: 1