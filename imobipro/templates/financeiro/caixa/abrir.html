{% extends 'base.html' %}
{% block title %}Abrir Caixa{% endblock %}
{% block content %}
<div class="container">
  <h1 class="h4 mb-3"><i class="bi bi-cash me-2"></i>Abrir Caixa</h1>
  <div class="card">
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-4">{{ form.banca_feira }}</div>
          <div class="col-md-4">{{ form.data }}</div>
          <div class="col-md-4">{{ form.saldo_inicial }}</div>
          <div class="col-12">{{ form.observacoes }}</div>
        </div>
        <small class="text-muted d-block mt-2">Se não selecionar uma banca, será aberto o Caixa Geral.</small>
        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Abrir</button>
          <a href="{% url 'financeiro:caixa_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
