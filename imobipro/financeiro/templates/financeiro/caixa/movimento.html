<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Novo Movimento</title>
</head>
<body>
  <h1>Novo Movimento - Caixa {{ sessao.banca_feira.codigo }} {{ sessao.data }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
  </form>
  <p><a href="{% url 'financeiro:caixa_detalhe' sessao.id %}">Voltar</a></p>
</body>
</html>
