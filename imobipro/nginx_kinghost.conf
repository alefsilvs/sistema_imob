# Configuração Nginx para Sistema Imobiliário - KingHost
# Salve este arquivo como: /etc/nginx/sites-available/sistema_imo

# Configuração de rate limiting
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

# Configuração de cache
proxy_cache_path /var/cache/nginx/sistema_imo levels=1:2 keys_zone=sistema_imo:10m max_size=100m inactive=60m use_temp_path=off;

# Upstream para o Gunicorn
upstream sistema_imo_app {
    server unix:/home/sistema_imo/apps/sistema_imo/sistema_imo.sock fail_timeout=0;
}

# Redirecionamento HTTP para HTTPS
server {
    listen 80;
    server_name seu-dominio.com.br www.seu-dominio.com.br;
    
    # Permitir Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # Redirecionar todo o resto para HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuração HTTPS principal
server {
    listen 443 ssl http2;
    server_name seu-dominio.com.br www.seu-dominio.com.br;
    
    # Configurações SSL (serão preenchidas pelo Certbot)
    # ssl_certificate /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    
    # Configurações de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;" always;
    
    # Configurações gerais
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Logs
    access_log /var/log/nginx/sistema_imo_access.log;
    error_log /var/log/nginx/sistema_imo_error.log;
    
    # Favicon
    location = /favicon.ico {
        alias /home/sistema_imo/public_html/static/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Robots.txt
    location = /robots.txt {
        alias /home/sistema_imo/public_html/static/robots.txt;
        access_log off;
        log_not_found off;
        expires 30d;
    }
    
    # Arquivos estáticos
    location /static/ {
        alias /home/sistema_imo/public_html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Compressão
        gzip_static on;
        
        # Headers de cache específicos por tipo
        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }
    
    # Arquivos de mídia
    location /media/ {
        alias /home/sistema_imo/public_html/media/;
        expires 30d;
        add_header Cache-Control "public";
        
        # Proteção para uploads sensíveis
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }
    
    # API com rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        include proxy_params;
        proxy_pass http://sistema_imo_app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # Cache para algumas rotas da API
        proxy_cache sistema_imo;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Login com rate limiting
    location /login/ {
        limit_req zone=login burst=5 nodelay;
        
        include proxy_params;
        proxy_pass http://sistema_imo_app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
    
    # Admin com proteção extra
    location /admin/ {
        # Opcional: Restringir por IP
        # allow 192.168.1.0/24;
        # deny all;
        
        include proxy_params;
        proxy_pass http://sistema_imo_app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # Timeouts maiores para admin
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
    
    # Aplicação principal
    location / {
        include proxy_params;
        proxy_pass http://sistema_imo_app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Bloquear acesso a arquivos sensíveis
    location ~* \.(env|log|ini|conf|bak|old|tmp)$ {
        deny all;
    }
    
    # Bloquear acesso a diretórios sensíveis
    location ~ /\. {
        deny all;
    }
    
    location ~ /(\.git|\.svn|\.hg) {
        deny all;
    }
}

# Configuração para subdomínios (SaaS)
server {
    listen 443 ssl http2;
    server_name *.seu-dominio.com.br;
    
    # Usar o mesmo certificado SSL
    # ssl_certificate /etc/letsencrypt/live/seu-dominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com.br/privkey.pem;
    
    # Mesmas configurações SSL e segurança do servidor principal
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    client_max_body_size 50M;
    
    # Logs separados para subdomínios
    access_log /var/log/nginx/sistema_imo_subdomain_access.log;
    error_log /var/log/nginx/sistema_imo_subdomain_error.log;
    
    # Arquivos estáticos (mesmo local)
    location /static/ {
        alias /home/sistema_imo/public_html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }
    
    location /media/ {
        alias /home/sistema_imo/public_html/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Aplicação (com identificação de tenant)
    location / {
        include proxy_params;
        proxy_pass http://sistema_imo_app;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}