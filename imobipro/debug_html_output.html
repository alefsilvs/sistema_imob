<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ImobiPro</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --netflix-red: #e50914;
            --netflix-dark: #141414;
            --netflix-gray: #333333;
            --netflix-light-gray: #b3b3b3;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            color: #ffffff;
        }
        
        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 2rem;
            font-weight: 800;
            color: var(--netflix-red);
            text-decoration: none;
            z-index: 1000;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: linear-gradient(145deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        
        .login-header {
            text-align: center;
            padding: 40px 40px 20px;
        }
        
        .login-header h2 {
            color: #ffffff;
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: var(--netflix-light-gray);
            font-size: 1rem;
        }
        
        .login-form {
            padding: 20px 40px 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        
        .form-control {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            background: rgba(42, 42, 42, 0.8);
            color: #ffffff !important;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--netflix-red);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
            background: rgba(42, 42, 42, 1);
            color: #ffffff !important;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-control::-webkit-input-placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        
        .form-control::-moz-placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        
        .form-control:-ms-input-placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        
        .form-control:-moz-placeholder {
            color: rgba(255, 255, 255, 0.5) !important;
        }
        
        /* Garantir que o texto digitado seja sempre visível */
        input[type="email"].form-control,
        input[type="password"].form-control {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        
        input[type="email"].form-control:focus,
        input[type="password"].form-control:focus {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--netflix-red) 0%, #b20710 100%);
            border: none;
            border-radius: 12px;
            padding: 18px 35px;
            font-weight: 700;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.3);
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.4);
            background: linear-gradient(135deg, #f40612 0%, var(--netflix-red) 100%);
        }
        
        .login-links {
            text-align: center;
            margin-top: 25px;
        }
        
        .login-links a {
            color: var(--netflix-light-gray);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .login-links a:hover {
            color: var(--netflix-red);
        }
        
        .divider {
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.3);
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 20px;
        }
        
        .alert-danger {
            background: rgba(229, 9, 20, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(229, 9, 20, 0.3);
        }
    </style>
</head>
<body>
    <a href="/saas/planos/" class="logo">ImobiPro</a>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Bem-vindo de volta</h2>
                <p>Faça login para acessar sua conta</p>
            </div>
            
            <div class="login-form">
                
                
                <form method="post">
                    <input type="hidden" name="csrfmiddlewaretoken" value="3b9OgjUst1klkksDPPy1AmKXwqklsmIwQO4UwJrYKGe6J1UgbzbNT4tmGdWpQoIF">
                    
                    <!-- Debug CSRF Token -->
                    <script>
                        console.log('CSRF Token Debug:');
                        console.log('Token presente:', document.querySelector('[name=csrfmiddlewaretoken]') ? 'SIM' : 'NÃO');
                        if (document.querySelector('[name=csrfmiddlewaretoken]')) {
                            console.log('Token value:', document.querySelector('[name=csrfmiddlewaretoken]').value);
                        }
                    </script>
                    
                    <div class="form-group">
                        <label for="id_username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="id_username" name="username" placeholder="Digite seu e-mail" required>
                        
                    </div>
                    
                    <div class="form-group">
                        <label for="id_password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="id_password" name="password" placeholder="Digite sua senha" required>
                        
                    </div>
                    
                    
                    
                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt me-2"></i>Entrar
                    </button>
                </form>
                
                <div class="login-links">
                    <a href="/accounts/password_reset/">Esqueci minha senha</a>
                    <div class="divider">•</div>
                    <a href="/saas/registro/">Criar nova conta</a>
                    <div class="divider">•</div>
                    <a href="/admin/" class="small">Acessar como Admin</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
